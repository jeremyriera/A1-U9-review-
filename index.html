<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A1 · Unidad 9 · La rutina diaria — Repaso interactivo</title>
<style>
  :root{
    --ink:#2b2620;
    --paper:#faf6ee;
    --card:#ffffff;
    --accent:#c1502e;
    --accent-dark:#9c3d21;
    --accent-soft:#f3ded2;
    --teal:#2f6f6a;
    --teal-soft:#dcede9;
    --gold:#d9a441;
    --line:#e7ddc9;
    --good:#2f7d4f;
    --good-bg:#e3f3e6;
    --bad:#c1392b;
    --bad-bg:#fbe4e0;
    --radius:16px;
    --shadow:0 4px 14px rgba(60,45,20,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    line-height:1.5;
    padding-bottom:60px;
  }
  header.top{
    background:linear-gradient(135deg,var(--accent) 0%, var(--accent-dark) 100%);
    color:#fff7ee;
    padding:34px 20px 60px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute;
    bottom:-40px; left:0; right:0;
    height:80px;
    background:var(--paper);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  header.top h1{
    font-size:1.9rem;
    margin:0 0 6px;
    letter-spacing:0.5px;
  }
  header.top p{
    margin:0;
    font-size:1rem;
    opacity:0.92;
    font-style:italic;
  }
  .badge-row{
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    margin-top:16px; position:relative; z-index:2;
  }
  .badge{
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.4);
    padding:5px 12px;
    border-radius:999px;
    font-size:0.8rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:inherit;
    cursor:pointer;
    transition:background 0.15s, transform 0.1s;
  }
  .badge:hover{ background:rgba(255,255,255,0.3); transform:translateY(-1px); }
  .badge:active{ transform:translateY(0); }
  main{
    max-width:820px;
    margin:-30px auto 0;
    padding:0 16px;
    position:relative;
    z-index:3;
  }
  .progress-card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:22px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .progress-card .ring{
    width:52px;height:52px;flex:0 0 52px;
  }
  .progress-track{
    flex:1;
    height:10px;
    background:var(--line);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--gold),var(--accent));
    border-radius:999px;
    transition:width 0.4s ease;
  }
  .progress-text{
    font-size:0.85rem;
    color:#6b6154;
    white-space:nowrap;
  }
  .lesson{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:20px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .lesson-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 20px;
    cursor:pointer;
    background:var(--teal-soft);
    user-select:none;
  }
  .lesson-head .num{
    width:38px;height:38px;border-radius:50%;
    background:var(--teal);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    flex:0 0 38px;
  }
  .lesson-head h2{
    margin:0;
    font-size:1.15rem;
    flex:1;
    color:var(--accent-dark);
  }
  .lesson-head .score-badge{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:0.78rem;
    font-weight:700;
    color:var(--teal);
    background:#fff;
    border:1px solid var(--teal);
    border-radius:999px;
    padding:3px 10px;
    white-space:nowrap;
  }
  .lesson-head .score-badge.full{
    background:var(--good);
    border-color:var(--good);
    color:#fff;
  }
  .lesson-head .chev{
    transition:transform 0.25s ease;
    font-size:1.1rem;
    color:var(--teal);
  }
  .lesson.open .chev{ transform:rotate(180deg); }
  .lesson-body{
    display:none;
    padding:6px 20px 22px;
  }
  .lesson.open .lesson-body{ display:block; }
  .block-title{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:0.75rem;
    color:var(--accent);
    font-weight:700;
    margin:22px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .block-title::before{
    content:"";
    width:18px;height:2px;
    background:var(--accent);
    display:inline-block;
  }
  .q{
    margin-bottom:16px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fffdf9;
  }
  .q p.qtext{
    margin:0 0 10px;
    font-size:1.02rem;
  }
  .opts{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    border:1.5px solid var(--line);
    border-radius:10px;
    cursor:pointer;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:0.95rem;
    transition:background 0.15s, border-color 0.15s;
  }
  .opt:hover{ border-color:var(--gold); }
  .opt.selected{ border-color:var(--teal); background:var(--teal-soft); }
  .opt.correct{ border-color:var(--good); background:var(--good-bg); }
  .opt.incorrect{ border-color:var(--bad); background:var(--bad-bg); }
  .opt input{ accent-color:var(--teal); }
  .fill-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .fill-row input[type=text]{
    border:none;
    border-bottom:2px solid var(--gold);
    background:transparent;
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-size:1rem;
    padding:4px 6px;
    width:150px;
    color:var(--accent-dark);
    font-weight:600;
  }
  .fill-row input[type=text]:focus{ outline:none; border-color:var(--accent); }
  .fill-row input.correct{ border-color:var(--good); background:var(--good-bg); }
  .fill-row input.incorrect{ border-color:var(--bad); background:var(--bad-bg); }
  .fill-row input.revealed{ border-color:var(--gold); background:var(--accent-soft); color:var(--accent-dark); }
  .btn.ghost{
    background:transparent;
    color:var(--accent);
    border:1.5px solid var(--accent);
    box-shadow:none;
  }
  .btn.ghost:hover{ background:var(--accent-soft); }
  .hint{
    font-size:0.8rem;
    color:#8a7f6d;
    font-style:italic;
    margin-top:4px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .feedback-icon{
    font-size:0.95rem;
  }
  .btn{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:9px 18px;
    border-radius:999px;
    font-size:0.88rem;
    font-weight:600;
    cursor:pointer;
    margin-top:8px;
    box-shadow:0 2px 6px rgba(150,60,30,0.25);
    transition:transform 0.1s ease, background 0.15s;
  }
  .btn:hover{ background:var(--accent-dark); transform:translateY(-1px); }
  .btn.secondary{
    background:var(--teal);
    box-shadow:0 2px 6px rgba(30,90,80,0.25);
  }
  .btn.secondary:hover{ background:#245854; }
  .block-score{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:0.85rem;
    margin-left:10px;
    color:var(--teal);
    font-weight:600;
  }
  .match-wrap{
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .match-col{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .match-item{
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fffdf9;
    cursor:pointer;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:0.9rem;
    transition:background 0.15s, border-color 0.15s;
    text-align:center;
  }
  .match-item.selected{ border-color:var(--gold); background:var(--accent-soft); }
  .match-item.matched{ border-color:var(--good); background:var(--good-bg); cursor:default; }
  .match-item.shake{ border-color:var(--bad); background:var(--bad-bg); }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }
  .shake{ animation:shake 0.3s; }
  .lesson-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .final-card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 22px;
    text-align:center;
    margin-top:10px;
    border:2px solid var(--gold);
  }
  .final-card h2{ color:var(--accent-dark); margin-top:0; }
  .final-score{
    font-size:2.4rem;
    font-weight:bold;
    color:var(--teal);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .final-msg{
    font-style:italic;
    color:#6b6154;
    margin-top:4px;
  }
  footer.pagefoot{
    text-align:center;
    font-size:0.8rem;
    color:#a89c86;
    margin-top:30px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  @media(max-width:480px){
    header.top h1{ font-size:1.5rem; }
    .match-wrap{ gap:8px; }
    .fill-row input[type=text]{ width:120px; }
  }
</style>
</head>
<body>

<header class="top">
  <h1>🕐 La rutina diaria</h1>
  <p>A1 · Unidad 9 · Repaso interactivo de las 4 lecciones</p>
  <div class="badge-row">
    <button class="badge" onclick="jumpTo('l1')">L1 · ¿Qué hora es?</button>
    <button class="badge" onclick="jumpTo('l2')">L2 · Por la mañana</button>
    <button class="badge" onclick="jumpTo('l3')">L3 · Durante el día</button>
    <button class="badge" onclick="jumpTo('l4')">L4 · Tarde y noche</button>
  </div>
</header>

<main>
  <div class="progress-card">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 0 correctas</div>
  </div>

  <div id="lessonsRoot"></div>

  <div class="final-card" id="finalCard" style="display:none;">
    <h2>¡Resultado final!</h2>
    <div class="final-score" id="finalScore">0%</div>
    <div class="final-grade" id="finalGrade" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:1rem; color:var(--accent-dark); font-weight:700; margin-top:2px;"></div>
    <p class="final-msg" id="finalMsg"></p>
    <div id="lessonBreakdown" style="text-align:left; max-width:360px; margin:14px auto 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:0.88rem;"></div>
    <button class="btn" onclick="resetAll()">🔄 Reiniciar todo el repaso</button>
  </div>

  <footer class="pagefoot">Hecho para practicar la Unidad 9 · ¡Mucho ánimo con tu español! 🌞</footer>
</main>

<script>
// ---------- normalization helper ----------
function norm(s){
  return s.toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // strip accents
    .replace(/\s+/g," ");
}

// ---------- CONTENT ----------
const lessons = [
{
  id:"l1", title:"Lección 1 · ¿Qué hora es?",
  mcq:[
    {q:"¿Cómo se dice correctamente la 1:00?", opts:["Es la una","Son la una","Es las una","Son las una"], a:0},
    {q:"Para las horas de las 2 a las 12 usamos…", opts:["Es","Son","Está","Estoy"], a:1},
    {q:"\"Menos cuarto\" significa que…", opts:["han pasado 15 minutos","han pasado 30 minutos","faltan 15 minutos para la hora","es la hora exacta"], a:2},
    {q:"En Latinoamérica, en vez de \"menos cuarto\", muchas veces se dice…", opts:["cuarto para","menos para","para cuarto","cuarto menos"], a:0},
    {q:"¿Cuál es la forma FORMAL de preguntar la hora?", opts:["Oye, ¿qué hora es?","¿Tienes hora?","Perdone, ¿qué hora es, por favor?","¿Qué hora es, tío?"], a:2},
  ],
  fill:[
    {before:"", answer:["es"], after:" la una en punto.", hint:"verbo ser, singular"},
    {before:"", answer:["son"], after:" las tres y media.", hint:"verbo ser, plural"},
    {before:"Son las cuatro ", answer:["menos"], after:" cuarto.", hint:"faltan 15 minutos"},
    {before:"Es la una y ", answer:["media"], after:".", hint:"30 minutos"},
    {before:"El tren sale ", answer:["a"], after:" las seis y media.", hint:"preposición de hora exacta"},
  ],
  match:{
    title:"Une la expresión con su significado",
    pairs:[
      ["En punto","Hora exacta"],
      ["Y cuarto","Han pasado 15 minutos"],
      ["Y media","Han pasado 30 minutos"],
      ["Menos cuarto","Faltan 15 minutos"],
      ["Desde… hasta…","Inicio y final de un período"],
    ]
  }
},
{
  id:"l2", title:"Lección 2 · Por la mañana",
  mcq:[
    {q:"\"Yo ___ a las seis de la mañana\" (despertarse)", opts:["despierto","me despierto","se despierta","despiertas"], a:1},
    {q:"La terminación de \"yo\" para verbos regulares -AR es…", opts:["-o","-as","-e","-es"], a:0},
    {q:"\"Hacer\" en primera persona (yo) es un verbo…", opts:["regular","irregular","reflexivo regular","no existe"], a:1},
    {q:"¿Cuál de estos verbos es reflexivo?", opts:["trabajar","comer","ducharse","vivir"], a:2},
    {q:"\"Yo salgo a trabajar a las siete\" — el verbo \"salir\" en yo es…", opts:["salo","salgo","salio","salgo yo"], a:1},
  ],
  fill:[
    {before:"Yo ", answer:["me levanto"], after:" temprano.", hint:"levantarse, yo"},
    {before:"Yo ", answer:["soy"], after:" griega.", hint:"ser, yo (irregular)"},
    {before:"Trabajo ", answer:["desde"], after:" las ocho ", after2:"hasta las cuatro.", hint:"marca el inicio"},
    {before:"Trabajo en una firma de abogados ", answer:["de"], after:" ocho a siete.", hint:"otra forma de dar el rango de horas"},
    {before:"Me despierto a las seis. ", answer:["luego"], after:", me levanto.", hint:"conector de secuencia"},
  ],
  match:{
    title:"Une el verbo infinitivo con su forma \"yo\"",
    pairs:[
      ["Desayunar","Desayuno"],
      ["Ducharse","Me ducho"],
      ["Hacer","Hago"],
      ["Coger","Cojo"],
      ["Ser","Soy"],
    ]
  }
},
{
  id:"l3", title:"Lección 3 · Durante el día",
  mcq:[
    {q:"\"¿A qué hora ___?\" siempre va seguido de…", opts:["un sustantivo","un verbo","un adjetivo","nada más"], a:1},
    {q:"\"Yo ___ a las doce y media\" (almorzar, verbo irregular o->ue)", opts:["almorzo","almuerzo","almorzo yo","almorza"], a:1},
    {q:"El adverbio que indica 100% de frecuencia es…", opts:["a veces","casi nunca","siempre","a menudo"], a:2},
    {q:"\"Casi siempre\" corresponde aproximadamente a…", opts:["10%","50%","70%","90%"], a:3},
    {q:"\"¿Qué haces después de trabajar?\" — \"después de\" indica…", opts:["una acción anterior","una acción posterior","el mismo momento","una pregunta formal"], a:1},
  ],
  fill:[
    {before:"¿A qué hora ", answer:["comes"], after:"?", hint:"comer, tú"},
    {before:"Yo ", answer:["voy"], after:" al gimnasio los martes.", hint:"ir, yo (irregular)"},
    {before:"", answer:["normalmente"], after:" desayuno yogur con miel.", hint:"adverbio: 80% de frecuencia"},
    {before:"Ella ", answer:["trabaja"], after:" siete horas.", hint:"trabajar, ella"},
    {before:"", answer:["nunca"], after:" tomo café por la noche.", hint:"0% de frecuencia"},
  ],
  match:{
    title:"Une el adverbio con su frecuencia aproximada",
    pairs:[
      ["Siempre","100%"],
      ["Casi siempre","90%"],
      ["Normalmente","80%"],
      ["A menudo","70%"],
      ["A veces","50%"],
      ["Nunca","0%"],
    ]
  }
},
{
  id:"l4", title:"Lección 4 · Por la tarde y la noche",
  mcq:[
    {q:"\"Nosotros ___ ensalada a las siete\" (cenar)", opts:["cenamos","cenan","cena","ceno"], a:0},
    {q:"\"Antes de\" y \"después de\" van seguidos de un verbo en…", opts:["presente","infinitivo","pasado","gerundio"], a:1},
    {q:"\"Ir + a + el parque\" se contrae en…", opts:["a el parque","al parque","a la parque","alo parque"], a:1},
    {q:"La contracción \"al\" NO se usa con…", opts:["el gimnasio","el hospital","la oficina","el parque"], a:2},
    {q:"\"Los sábados salgo con amigos\" — el plural del día indica…", opts:["una acción futura única","un hábito o frecuencia","una fecha exacta","una pregunta"], a:1},
  ],
  fill:[
    {before:"", answer:["antes de"], after:" dormir, leemos una novela.", hint:"ocurre primero: leer"},
    {before:"", answer:["despues de"], after:" cenar, vemos las noticias.", hint:"ocurre después: cenar (acepta con o sin tilde)"},
    {before:"Voy ", answer:["al"], after:" gimnasio.", hint:"a + el"},
    {before:"Nosotros nos ", answer:["acostamos"], after:" tarde.", hint:"acostarse, nosotros"},
    {before:"", answer:["a menudo"], after:", nos acostamos a las once.", hint:"adverbio: 70%"},
  ],
  match:{
    title:"Une el verbo con su forma \"nosotros/-as\"",
    pairs:[
      ["Vivir","Vivimos"],
      ["Regresar","Regresamos"],
      ["Ir","Vamos"],
      ["Hacer","Hacemos"],
      ["Acostarse","Nos acostamos"],
      ["Levantarse","Nos levantamos"],
    ]
  }
}
];

// ---------- STATE ----------
let totalQuestions = 0;
let correctCount = 0;
const stateByLesson = {}; // per lesson correctness tracking

lessons.forEach(l=>{
  totalQuestions += l.mcq.length + l.fill.length + l.match.pairs.length;
  stateByLesson[l.id] = {mcq:new Array(l.mcq.length).fill(null), fill:new Array(l.fill.length).fill(null), match:new Array(l.match.pairs.length).fill(false)};
});

function gradeFor(pct){
  if(pct === 100) return "A+";
  if(pct >= 90) return "A";
  if(pct >= 80) return "B";
  if(pct >= 70) return "C";
  if(pct >= 60) return "D";
  return "F";
}

function updateProgress(){
  let correct = 0;
  const perLesson = [];
  lessons.forEach(l=>{
    const st = stateByLesson[l.id];
    let lc = 0, lt = st.mcq.length + st.fill.length + st.match.length;
    st.mcq.forEach(v=>{ if(v===true){ lc++; correct++; } });
    st.fill.forEach(v=>{ if(v===true){ lc++; correct++; } });
    st.match.forEach(v=>{ if(v===true){ lc++; correct++; } });
    perLesson.push({title:l.title, correct:lc, total:lt});
    const badge = document.getElementById('badge-'+l.id);
    if(badge){
      badge.textContent = lc + " / " + lt;
      badge.classList.toggle('full', lc === lt && lt > 0);
    }
  });
  correctCount = correct;
  const pct = totalQuestions ? Math.round((correct/totalQuestions)*100) : 0;
  document.getElementById('progressFill').style.width = pct + "%";
  document.getElementById('progressText').textContent = correct + " / " + totalQuestions + " correctas (" + pct + "%)";

  if(correct === totalQuestions){
    document.getElementById('finalCard').style.display = 'block';
    document.getElementById('finalScore').textContent = "100%";
    document.getElementById('finalGrade').textContent = "Nota: " + gradeFor(100);
    document.getElementById('finalMsg').textContent = "¡Excelente! Dominas la rutina diaria en español. 🎉";
    const bd = document.getElementById('lessonBreakdown');
    bd.innerHTML = perLesson.map(p => `<div style="display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line);"><span>${p.title}</span><strong>${p.correct}/${p.total}</strong></div>`).join('');
    document.getElementById('finalCard').scrollIntoView({behavior:'smooth', block:'center'});
  }
}

// ---------- RENDER ----------
const root = document.getElementById('lessonsRoot');

lessons.forEach((l, li)=>{
  const sec = document.createElement('div');
  sec.className = 'lesson';
  sec.id = 'sec-'+l.id;

  const head = document.createElement('div');
  head.className = 'lesson-head';
  head.innerHTML = `<div class="num">${li+1}</div><h2>${l.title}</h2><span class="score-badge" id="badge-${l.id}">0 / 0</span><div class="chev">▾</div>`;
  head.onclick = ()=> sec.classList.toggle('open');
  sec.appendChild(head);

  const body = document.createElement('div');
  body.className = 'lesson-body';

  // MCQ block
  const mcqTitle = document.createElement('div');
  mcqTitle.className = 'block-title';
  mcqTitle.textContent = 'Opción múltiple';
  body.appendChild(mcqTitle);

  l.mcq.forEach((item, qi)=>{
    const qdiv = document.createElement('div');
    qdiv.className = 'q';
    qdiv.innerHTML = `<p class="qtext">${qi+1}. ${item.q}</p>`;
    const optsDiv = document.createElement('div');
    optsDiv.className = 'opts';
    item.opts.forEach((opt, oi)=>{
      const label = document.createElement('label');
      label.className = 'opt';
      label.innerHTML = `<input type="radio" name="${l.id}-mcq-${qi}" value="${oi}"> <span>${opt}</span>`;
      label.onclick = ()=>{
        if(stateByLesson[l.id].mcq[qi] === true) return; // already correct, locked
        [...optsDiv.children].forEach(c=>c.classList.remove('selected'));
        label.classList.add('selected');
        setTimeout(()=>{
          const correct = (oi === item.a);
          [...optsDiv.children].forEach((c,ci)=>{
            c.classList.remove('selected');
            if(ci === item.a) c.classList.add('correct');
            else if(ci === oi && !correct) c.classList.add('incorrect');
          });
          stateByLesson[l.id].mcq[qi] = correct;
          updateProgress();
        }, 120);
      };
      optsDiv.appendChild(label);
    });
    qdiv.appendChild(optsDiv);
    body.appendChild(qdiv);
  });

  // Fill in the blank block
  const fillTitle = document.createElement('div');
  fillTitle.className = 'block-title';
  fillTitle.textContent = 'Completa la frase';
  body.appendChild(fillTitle);

  l.fill.forEach((item, fi)=>{
    const qdiv = document.createElement('div');
    qdiv.className = 'q';
    const row = document.createElement('div');
    row.className = 'fill-row';
    row.innerHTML = `<span>${fi+1}. ${item.before}</span><input type="text" autocomplete="off" spellcheck="false"><span>${item.after}${item.after2 ? " "+item.after2 : ""}</span>`;
    const input = row.querySelector('input');
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') checkFill(); });
    qdiv.appendChild(row);
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = '💡 Pista: ' + item.hint;
    qdiv.appendChild(hint);
    const fb = document.createElement('div');
    fb.className = 'feedback-icon';
    fb.style.marginTop = '4px';
    qdiv.appendChild(fb);

    function checkFill(){
      if(stateByLesson[l.id].fill[fi] === true) return;
      const val = norm(input.value);
      const ok = item.answer.some(a => norm(a) === val);
      input.classList.remove('correct','incorrect','revealed');
      input.classList.add(ok ? 'correct' : 'incorrect');
      fb.textContent = ok ? '✅ ¡Correcto!' : '❌ Intenta de nuevo';
      stateByLesson[l.id].fill[fi] = ok;
      updateProgress();
    }
    function revealFill(){
      input.disabled = true;
      input.value = item.answer[0];
      input.classList.remove('correct','incorrect');
      input.classList.add('revealed');
      fb.textContent = '👀 Respuesta: ' + item.answer[0];
      if(stateByLesson[l.id].fill[fi] !== true){
        stateByLesson[l.id].fill[fi] = false; // shown, not counted correct
      }
      checkBtn.disabled = true;
      revealBtn.disabled = true;
      updateProgress();
    }
    const btnRow = document.createElement('div');
    btnRow.style.display = 'flex';
    btnRow.style.gap = '8px';
    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn secondary';
    checkBtn.textContent = 'Comprobar';
    checkBtn.style.marginTop = '8px';
    checkBtn.onclick = checkFill;
    const revealBtn = document.createElement('button');
    revealBtn.className = 'btn ghost';
    revealBtn.textContent = 'Ver respuesta';
    revealBtn.style.marginTop = '8px';
    revealBtn.onclick = revealFill;
    btnRow.appendChild(checkBtn);
    btnRow.appendChild(revealBtn);
    qdiv.appendChild(btnRow);
    body.appendChild(qdiv);
  });

  // Matching block
  const matchTitle = document.createElement('div');
  matchTitle.className = 'block-title';
  matchTitle.textContent = 'Relaciona (toca un elemento de cada columna)';
  body.appendChild(matchTitle);

  const matchWrapOuter = document.createElement('div');
  matchWrapOuter.className = 'q';
  const matchHeading = document.createElement('p');
  matchHeading.className = 'qtext';
  matchHeading.textContent = l.match.title;
  matchWrapOuter.appendChild(matchHeading);

  const matchWrap = document.createElement('div');
  matchWrap.className = 'match-wrap';
  const colA = document.createElement('div');
  colA.className = 'match-col';
  const colB = document.createElement('div');
  colB.className = 'match-col';

  const leftItems = l.match.pairs.map((p,i)=>({text:p[0], idx:i}));
  const rightItems = l.match.pairs.map((p,i)=>({text:p[1], idx:i}));
  // shuffle right column
  for(let i = rightItems.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [rightItems[i], rightItems[j]] = [rightItems[j], rightItems[i]];
  }

  let selectedLeft = null;
  let selectedLeftEl = null;

  leftItems.forEach(item=>{
    const div = document.createElement('div');
    div.className = 'match-item';
    div.textContent = item.text;
    div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(div.classList.contains('matched')) return;
      [...colA.children].forEach(c=>c.classList.remove('selected'));
      div.classList.add('selected');
      selectedLeft = item.idx;
      selectedLeftEl = div;
    };
    colA.appendChild(div);
  });

  rightItems.forEach(item=>{
    const div = document.createElement('div');
    div.className = 'match-item';
    div.textContent = item.text;
    div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(div.classList.contains('matched')) return;
      if(selectedLeft === null) return;
      if(selectedLeft === item.idx){
        selectedLeftEl.classList.remove('selected');
        selectedLeftEl.classList.add('matched');
        div.classList.add('matched');
        stateByLesson[l.id].match[item.idx] = true;
        selectedLeft = null; selectedLeftEl = null;
        updateProgress();
      } else {
        div.classList.add('shake');
        selectedLeftEl.classList.add('shake');
        setTimeout(()=>{
          div.classList.remove('shake');
          selectedLeftEl.classList.remove('shake','selected');
          selectedLeft = null; selectedLeftEl = null;
        }, 350);
      }
    };
    colB.appendChild(div);
  });

  matchWrap.appendChild(colA);
  matchWrap.appendChild(colB);
  matchWrapOuter.appendChild(matchWrap);
  body.appendChild(matchWrapOuter);

  sec.appendChild(body);
  root.appendChild(sec);
});

// open first lesson by default
document.getElementById('sec-'+lessons[0].id).classList.add('open');

function resetAll(){
  location.reload();
}

function jumpTo(id){
  const sec = document.getElementById('sec-'+id);
  if(!sec) return;
  document.querySelectorAll('.lesson').forEach(s=>{ if(s.id !== 'sec-'+id) s.classList.remove('open'); });
  sec.classList.add('open');
  sec.scrollIntoView({behavior:'smooth', block:'start'});
}
</script>
</body>
</html>
